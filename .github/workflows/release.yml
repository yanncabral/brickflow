name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      - name: Check npm bootstrap
        id: bootstrap
        shell: bash
        run: |
          if output=$(npm view brickflow@0.0.1 version --json 2>&1); then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if grep -Eq '"code"[[:space:]]*:[[:space:]]*"E404"' <<< "$output"; then
              echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping automated releases until brickflow@0.0.1 is published manually."
            else
              printf '%s\n' "$output" >&2
              exit "$status"
            fi
          fi

      - name: Create release pull request or publish
        if: steps.bootstrap.outputs.bootstrapped == 'true'
        uses: changesets/action@v1
        with:
          github-token: ${{ github.token }}
          version: bun run version-packages
          publish: bun run release
          title: "chore: release brickflow"
          commit: "chore: release brickflow"
          createGithubReleases: true
